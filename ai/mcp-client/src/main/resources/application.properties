server.port=8083

# Spring AI Groq Configuration (via OpenAI compatibility)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Connecting to the local mcp-server process
spring.ai.mcp.client.name=medical-iot-mcp-client
spring.ai.mcp.client.version=1.0.0
# The HTTP transport config for connecting to mcp-server
spring.ai.mcp.client.connections.local-mcp-server.transport=sse
spring.ai.mcp.client.connections.local-mcp-server.sse.url=http://localhost:9090/sse

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medical_iot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:malcolm}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Chat Memory Configuration
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Auth Server URL config internally
jwt.secret=${JWT_SECRET}
