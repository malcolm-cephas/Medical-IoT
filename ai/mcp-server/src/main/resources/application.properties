server.port=8082

# Database Connection (To fetch accurate data for MCP tools)
spring.datasource.url=jdbc:mysql://localhost:3306/medical_iot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:malcolm}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MCP Server Settings
spring.ai.mcp.server.transport=webmvc
spring.ai.mcp.server.webmvc.sse-path=/mcp/sse
spring.ai.mcp.server.webmvc.message-path=/mcp/message
